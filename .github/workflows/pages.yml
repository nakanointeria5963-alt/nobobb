# main に変更が入るたび、その中身を丸ごと gh-pages ブランチに写します。
# このリポジトリの Pages は gh-pages ブランチを置いたことで有効になったので、
# 公開されているのも gh-pages ブランチの中身です。
#
# GitHub Actions の成果物を直接配る方式 (actions/deploy-pages) も試しましたが、
# github-pages 環境への配置がはじかれて失敗しました。こちらの方式は通ります。
name: ページを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gh-pages に写す
        run: git push origin HEAD:refs/heads/gh-pages --force
