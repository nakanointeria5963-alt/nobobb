<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームページ、つくってみる</title>
<meta name="description" content="えらんでいくだけで、ホームページがその場で出来上がっていくアプリです。">
<meta name="theme-color" content="#ff8fa8">
<style>
:root{
  --bg:#fff7f9; --panel:#ffffff; --ink:#3b2b31; --muted:#907c84;
  --line:#f2dfe5; --pink:#ff7d9c; --pink-soft:#ffeef2;
  --shadow:0 3px 0 #f4dde3, 0 10px 26px -14px rgba(120,60,80,.35);
  --r:22px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#221a1e; --panel:#2e2429; --ink:#f6ecef; --muted:#b8a3ab;
    --line:#3f333a; --pink:#ff96b0; --pink-soft:#3a2830;
    --shadow:0 3px 0 #1a1417, 0 10px 26px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}

/* ── プレビュー ───────────────────────── */
.stage{
  position:sticky; top:0; z-index:20;
  background:var(--bg); padding:12px 14px 10px;
  border-bottom:1px solid var(--line);
}
.stage-head{
  display:flex; align-items:center; gap:8px;
  margin:0 0 8px; font-size:.8rem; color:var(--muted);
}
.stage-head b{color:var(--ink); font-size:.9rem}
.count{
  margin-left:auto; background:var(--pink-soft); color:var(--pink);
  font-weight:700; font-size:.75rem; padding:3px 10px; border-radius:999px;
}
.phone{
  position:relative; margin:0 auto; max-width:420px;
  border:6px solid var(--panel); border-radius:26px;
  box-shadow:var(--shadow); overflow:hidden; background:#fff;
}
.phone iframe{display:block; width:100%; height:42vh; min-height:230px; border:0}
.phone.flash{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.012)}100%{transform:scale(1)}}

/* ── えらぶ ───────────────────────────── */
.wrap{max-width:560px; margin:0 auto; padding:22px 16px 120px}
.step{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 16px 16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.step > h2{
  margin:0 0 2px; font-size:1.02rem; display:flex; align-items:center; gap:8px;
}
.num{
  flex:none; width:24px; height:24px; border-radius:50%;
  background:var(--pink); color:#fff; font-size:.75rem; font-weight:700;
  display:grid; place-items:center;
}
.hint{margin:0 0 14px 32px; font-size:.8rem; color:var(--muted)}

.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px}
.opts.tight{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.opt{
  font-family:inherit; font-size:.9rem; text-align:left; cursor:pointer;
  padding:12px 13px; color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:15px;
  display:flex; align-items:center; gap:9px; transition:transform .12s, border-color .12s;
}
.opt .em{font-size:1.15rem; line-height:1}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{
  border-color:var(--pink); background:var(--pink-soft); font-weight:700;
}
.opt[aria-pressed="true"]::after{content:"✓"; margin-left:auto; color:var(--pink); font-weight:700}

.swatches{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:9px}
.sw{
  cursor:pointer; font-family:inherit; font-size:.8rem; padding:9px 6px 8px;
  background:var(--bg); border:2px solid var(--line); border-radius:15px;
  color:var(--ink); display:grid; gap:6px; justify-items:center;
  transition:transform .12s;
}
.sw:active{transform:scale(.94)}
.sw i{display:block; width:100%; height:22px; border-radius:8px}
.sw[aria-pressed="true"]{border-color:var(--pink); background:var(--pink-soft); font-weight:700}

label.field{display:block; margin-bottom:11px; font-size:.82rem; color:var(--muted)}
label.field input{
  display:block; width:100%; margin-top:5px; padding:12px 14px;
  font-size:1rem; font-family:inherit; color:var(--ink);
  background:var(--bg); border:2px solid var(--line); border-radius:15px;
}
label.field input:focus{outline:none; border-color:var(--pink)}

/* ── できあがり ──────────────────────── */
.done{
  background:var(--pink-soft); border:2px dashed var(--pink);
  border-radius:var(--r); padding:20px 16px; text-align:center;
}
.done h2{margin:0 0 4px; font-size:1.05rem}
.done p{margin:0 0 16px; font-size:.83rem; color:var(--muted)}
.btns{display:grid; gap:9px}
.btn{
  font-family:inherit; font-size:.95rem; font-weight:700; cursor:pointer;
  padding:14px; border-radius:15px; border:2px solid var(--pink);
  background:var(--pink); color:#fff; transition:transform .12s;
}
.btn.ghost{background:var(--panel); color:var(--pink)}
.btn:active{transform:scale(.97)}
.msg{margin:12px 0 0; min-height:1.4em; font-size:.82rem; color:var(--pink); font-weight:700}

footer{margin-top:22px; font-size:.78rem; color:var(--muted); text-align:center}
footer a{color:var(--pink)}

@media (min-width:900px){
  body{display:grid; grid-template-columns:1fr 1fr; align-items:start}
  .stage{position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
    justify-content:center; border-bottom:0; border-right:1px solid var(--line); padding:20px}
  .phone iframe{height:74vh}
  .wrap{padding-top:26px}
}
</style>
</head>
<body>

<div class="stage">
  <p class="stage-head"><b>できあがっていくところ</b><span id="count" class="count"></span></p>
  <div class="phone" id="phone"><iframe id="pv" title="ホームページのプレビュー" sandbox=""></iframe></div>
</div>

<div class="wrap">

  <section class="step">
    <h2><span class="num">1</span>なんのホームページ？</h2>
    <p class="hint">えらぶと、中の文章もそれっぽく入れ替わります。</p>
    <div class="opts" id="kind"></div>
  </section>

  <section class="step">
    <h2><span class="num">2</span>名前と、ひとこと</h2>
    <p class="hint">空のままでも大丈夫。見本の文字が入ります。</p>
    <label class="field">お店・会社の名前<input id="name" type="text" placeholder="例：中野インテリア" autocomplete="off"></label>
    <label class="field">ひとこと<input id="tagline" type="text" placeholder="例：住まいのことなら、なんでも。" autocomplete="off"></label>
  </section>

  <section class="step">
    <h2><span class="num">3</span>色</h2>
    <p class="hint">押すたびに、右（上）の色が変わります。</p>
    <div class="swatches" id="color"></div>
  </section>

  <section class="step">
    <h2><span class="num">4</span>かたち と 文字</h2>
    <p class="hint">角のまるさと、字の感じ。</p>
    <div class="opts tight" id="round" style="margin-bottom:9px"></div>
    <div class="opts tight" id="font"></div>
  </section>

  <section class="step">
    <h2><span class="num">5</span>のせるもの</h2>
    <p class="hint">いくつでも。押すと増えて、もう一度押すと消えます。</p>
    <div class="opts" id="parts"></div>
  </section>

  <section class="step">
    <h2><span class="num">6</span>ならべかた</h2>
    <p class="hint">一番上を、写真にするか文字にするか。</p>
    <div class="opts" id="layout"></div>
  </section>

  <section class="done">
    <h2>できあがり 🎉</h2>
    <p>この1枚があれば、そのままホームページになります。</p>
    <div class="btns">
      <button class="btn" id="dl" type="button">ファイルにして持ち帰る</button>
      <button class="btn ghost" id="cp" type="button">中身をコピーする</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <footer>
    <p>つくったものは、この端末の中だけに残ります。<br>どこにも送られません。</p>
    <p><a href="../">← おうちの応急処置</a></p>
  </footer>
</div>

<script>
/* ───── えらべるもの ───── */
const KINDS = {
  shop:{ em:"🍰", label:"お店・カフェ",
    name:"そら珈琲", tag:"毎朝、豆をひいています。",
    items:[["ブレンド","500円"],["本日のケーキ","450円"],["モーニング","750円"]],
    voices:["静かで、長居してしまいます。","ケーキがちょうどいい甘さでした。"],
    photos:["☕","🍰","🪟"], itemsTitle:"メニュー" },
  kaisha:{ em:"🏠", label:"会社・工務店",
    name:"中野インテリア", tag:"住まいのことなら、なんでも。",
    items:[["内装リフォーム","お見積り無料"],["クロスの張り替え","6畳 40,000円〜"],["建具の修理","5,000円〜"]],
    voices:["急な水漏れにすぐ来てくれました。","仕上がりがきれいで驚きました。"],
    photos:["🔨","🪑","🚪"], itemsTitle:"できること" },
  kyoshitsu:{ em:"🎹", label:"教室・サロン",
    name:"ひなたピアノ教室", tag:"はじめての一曲を、いっしょに。",
    items:[["体験レッスン","無料"],["月4回コース","8,000円"],["単発レッスン","2,500円"]],
    voices:["子どもが自分から練習するように。","先生がとても優しいです。"],
    photos:["🎹","🎵","🌿"], itemsTitle:"レッスン" },
  sakuhin:{ em:"🎨", label:"自分の作品",
    name:"たなか工房", tag:"木のものを、つくっています。",
    items:[["オーダー家具","ご相談ください"],["小物・雑貨","1,200円〜"],["修理のご相談","無料"]],
    voices:["長く使える一台になりました。","手ざわりがとても良いです。"],
    photos:["🪵","🧺","✨"], itemsTitle:"つくれるもの" }
};
const COLORS = {
  ichigo:{ label:"いちご", accent:"#e05572", soft:"#ffeff2", ink:"#3d2229", bg:"#fffafb" },
  mikan: { label:"みかん", accent:"#e0803a", soft:"#fff2e6", ink:"#3f2a17", bg:"#fffcf8" },
  wakaba:{ label:"わかば", accent:"#4a9d6a", soft:"#eaf6ef", ink:"#1f3a29", bg:"#fafdfb" },
  sora:  { label:"そら",   accent:"#4a86c5", soft:"#e9f1fa", ink:"#1e3247", bg:"#fafcff" },
  sumire:{ label:"すみれ", accent:"#8a6bc1", soft:"#f2ecfa", ink:"#2f2444", bg:"#fdfbff" },
  suna:  { label:"すな",   accent:"#a8825a", soft:"#f7f1e8", ink:"#3a3026", bg:"#fffdfa" }
};
const ROUNDS = { kaku:{em:"⬜",label:"かくかく",v:"4px"}, maru:{em:"🔲",label:"すこし丸い",v:"14px"}, manmaru:{em:"⚪",label:"まんまる",v:"28px"} };
const FONTS = {
  gothic:{ em:"あ", label:"ゴシック", v:'-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif' },
  mincho:{ em:"明", label:"明朝",     v:'"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif' },
  marugo:{ em:"ま", label:"まる文字", v:'"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Noto Sans JP",sans-serif' }
};
const PARTS = {
  photo:  {em:"📷", label:"写真"},
  items:  {em:"📋", label:"メニュー・料金"},
  voices: {em:"💬", label:"お客さんの声"},
  map:    {em:"📍", label:"場所・地図"},
  contact:{em:"📞", label:"お問い合わせ"},
  hours:  {em:"🕒", label:"営業時間"}
};
const LAYOUTS = { photo:{em:"🖼", label:"写真が大きい"}, moji:{em:"✍️", label:"文字が中心"} };

/* ───── いまの状態 ───── */
const S = {
  kind:"kaisha", name:"", tagline:"", color:"sora", round:"maru", font:"gothic",
  layout:"photo", parts:{ photo:true, items:true, voices:false, map:false, contact:true, hours:false }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ───── ホームページを組み立てる ───── */
function build(){
  const k = KINDS[S.kind], c = COLORS[S.color];
  const r = ROUNDS[S.round].v, f = FONTS[S.font].v;
  const name = esc(S.name.trim() || k.name);
  const tag  = esc(S.tagline.trim() || k.tag);
  const P = S.parts;

  const hero = S.layout === "photo"
    ? `<header class="hero photo">
      <div class="art">${k.photos[0]}</div>
      <h1>${name}</h1><p>${tag}</p>
    </header>`
    : `<header class="hero moji"><h1>${name}</h1><p>${tag}</p></header>`;

  const secs = [];
  if (P.photo) secs.push(`<section class="gal">${k.photos.map(e=>`<div class="ph">${e}</div>`).join("")}</section>`);
  if (P.items) secs.push(`<section><h2>${k.itemsTitle}</h2><ul class="items">${
    k.items.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join("")}</ul></section>`);
  if (P.voices) secs.push(`<section><h2>お客さまの声</h2>${
    k.voices.map(v=>`<blockquote>${v}</blockquote>`).join("")}</section>`);
  if (P.hours) secs.push(`<section><h2>営業時間</h2><ul class="items">
    <li><span>平日</span><b>9:00 〜 18:00</b></li>
    <li><span>土曜</span><b>9:00 〜 15:00</b></li>
    <li><span>日曜・祝日</span><b>お休み</b></li></ul></section>`);
  if (P.map) secs.push(`<section><h2>場所</h2><div class="map">📍 ここに地図が入ります</div>
    <p class="addr">〒000-0000　○○県○○市○○町 1-2-3</p></section>`);
  if (P.contact) secs.push(`<section class="cta"><h2>お問い合わせ</h2>
    <p>お気軽にご連絡ください。</p>
    <a class="tel" href="tel:00000000000">☎ 000-0000-0000</a>
    <a class="mail" href="mailto:info@example.com">メールで問い合わせる</a></section>`);

  return `<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${name}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:${f};color:${c.ink};background:${c.bg};line-height:1.8;font-size:16px}
.page{max-width:640px;margin:0 auto;padding:0 20px 56px}
.hero{text-align:center;padding:44px 0 30px}
.hero h1{margin:0 0 8px;font-size:1.85rem;letter-spacing:.02em}
.hero p{margin:0;color:${c.accent};font-size:.98rem}
.hero.photo .art{height:170px;border-radius:${r};background:${c.soft};
  display:grid;place-items:center;font-size:3.4rem;margin-bottom:22px}
.hero.moji{padding:64px 0 44px;border-bottom:2px solid ${c.soft}}
section{margin-top:38px}
h2{font-size:1.02rem;margin:0 0 14px;padding-left:11px;border-left:4px solid ${c.accent}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:26px}
.ph{aspect-ratio:1;border-radius:${r};background:${c.soft};display:grid;place-items:center;font-size:1.9rem}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;gap:12px;align-items:baseline;padding:12px 2px;border-bottom:1px solid ${c.soft}}
.items b{margin-left:auto;color:${c.accent};white-space:nowrap}
blockquote{margin:0 0 11px;padding:14px 16px;border-radius:${r};background:${c.soft};font-size:.94rem}
.map{height:130px;border-radius:${r};background:${c.soft};display:grid;place-items:center;color:${c.accent};font-size:.92rem}
.addr{font-size:.86rem;margin:11px 0 0}
.cta{background:${c.soft};border-radius:${r};padding:24px 20px;text-align:center}
.cta h2{border:0;padding:0;margin-bottom:6px}
.cta p{margin:0 0 16px;font-size:.9rem}
.tel{display:block;font-size:1.3rem;font-weight:700;color:${c.accent};text-decoration:none;margin-bottom:12px}
.mail{display:inline-block;padding:11px 24px;border-radius:${r};
  background:${c.accent};color:#fff;text-decoration:none;font-size:.92rem}
footer{margin-top:44px;padding-top:20px;border-top:1px solid ${c.soft};
  text-align:center;font-size:.8rem;opacity:.65}
</style></head>
<body><div class="page">
${hero}
${secs.join("\n")}
<footer>© ${name}</footer>
</div></body></html>`;
}

/* ───── 画面を書き換える ───── */
const pv = document.getElementById("pv");
const phone = document.getElementById("phone");
const count = document.getElementById("count");

function paint(){
  pv.srcdoc = build();
  const n = Object.values(S.parts).filter(Boolean).length;
  count.textContent = "のせているもの " + n + "こ";
  phone.classList.remove("flash");
  void phone.offsetWidth;
  phone.classList.add("flash");
}

function pick(boxId, data, key, cls){
  const box = document.getElementById(boxId);
  Object.entries(data).forEach(([id, o]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = cls || "opt";
    b.setAttribute("aria-pressed", String(S[key] === id));
    b.innerHTML = cls === "sw"
      ? `<i style="background:${o.accent}"></i>${o.label}`
      : `<span class="em">${o.em}</span>${o.label}`;
    b.addEventListener("click", () => {
      S[key] = id;
      [...box.children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      paint();
    });
    box.appendChild(b);
  });
}

pick("kind", KINDS, "kind");
pick("color", COLORS, "color", "sw");
pick("round", ROUNDS, "round");
pick("font", FONTS, "font");
pick("layout", LAYOUTS, "layout");

const partsBox = document.getElementById("parts");
Object.entries(PARTS).forEach(([id, o]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "opt";
  b.setAttribute("aria-pressed", String(S.parts[id]));
  b.innerHTML = `<span class="em">${o.em}</span>${o.label}`;
  b.addEventListener("click", () => {
    S.parts[id] = !S.parts[id];
    b.setAttribute("aria-pressed", String(S.parts[id]));
    paint();
  });
  partsBox.appendChild(b);
});

["name","tagline"].forEach(id => {
  document.getElementById(id).addEventListener("input", e => { S[id] = e.target.value; paint(); });
});

/* ───── 持ち帰る ───── */
const msg = document.getElementById("msg");
let t;
const say = s => { msg.textContent = s; clearTimeout(t); t = setTimeout(() => msg.textContent = "", 2600); };

document.getElementById("dl").addEventListener("click", () => {
  const blob = new Blob([build()], { type:"text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say("ダウンロードしました");
});

document.getElementById("cp").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(build());
    say("コピーしました");
  } catch (e) {
    say("コピーできませんでした。持ち帰るボタンをお使いください");
  }
});

paint();
</script>
</body>
</html>
